name: aula-dev

services:
  db:
    image: postgres:16-alpine
    container_name: aula-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aula
      POSTGRES_USER: aula
      POSTGRES_PASSWORD: aula
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - devdata:/var/lib/postgresql/data

volumes:
  devdata:
